name: Adapter verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact package and vendor bytes
        run: node scripts/verify-package.mjs
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt
      - name: Check adapter formatting
        run: cargo +1.94.1 fmt --package evolut-jupiter-amm -- --check
      - name: Quote and native execution parity
        run: cargo +1.94.1 test --locked
